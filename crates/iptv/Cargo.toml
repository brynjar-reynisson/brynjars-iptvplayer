[package]
name = "iptv"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
tempfile = "3"
