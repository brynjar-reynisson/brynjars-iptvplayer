<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Live</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  #name { flex: 1; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: #000; color: #fff; border: 1px solid #fff; border-radius: 6px; padding: 8px 12px; font-size: 15px; }
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; max-height: 100%; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-size: 20px; text-align: center; padding: 16px; box-sizing: border-box; }
  #tap { background: rgba(0,0,0,.55); cursor: pointer; }
  #wait { background: #000; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div id="name">&nbsp;</div>
  <button id="fs" type="button">Fullscreen</button>
</header>
<div id="stage">
  <video id="v" playsinline controls></video>
  <div id="tap" class="overlay" hidden>Tap to play</div>
  <div id="wait" class="overlay">Waiting for the stream...</div>
</div>
<script src="hls.js"></script>
<script>
(function () {
  var v = document.getElementById('v');
  var nameEl = document.getElementById('name');
  var tap = document.getElementById('tap');
  var wait = document.getElementById('wait');
  var hls = null;
  var attached = false;
  var live = false;

  function showWait(on) { wait.hidden = !on; }
  function showTap(on) { tap.hidden = !on; }

  function destroy() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    attached = false;
    try { v.removeAttribute('src'); v.load(); } catch (e) {}
  }

  function tryPlay() {
    var p = v.play();
    if (p && p.then) {
      p.then(function () { showTap(false); }, function () { showTap(true); });
    }
  }

  function attach() {
    if (attached) return;
    attached = true;
    var native = v.canPlayType('application/vnd.apple.mpegurl');
    if (native) {
      v.src = 'live.m3u8';
      tryPlay();
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3 });
      hls.on(Hls.Events.ERROR, function (ev, data) {
        if (data && data.fatal) { showWait(true); destroy(); }
      });
      hls.loadSource('live.m3u8');
      hls.attachMedia(v);
      tryPlay();
    } else {
      wait.textContent = 'This browser cannot play the stream.';
    }
  }

  v.addEventListener('playing', function () { showWait(false); showTap(false); });
  v.addEventListener('error', function () { showWait(true); destroy(); });
  v.addEventListener('ended', function () { showWait(true); destroy(); });
  tap.addEventListener('click', function () { tryPlay(); });

  document.getElementById('fs').addEventListener('click', function () {
    var el = document.getElementById('stage');
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); }
  });

  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', 'status');
    x.onload = function () {
      try {
        var s = JSON.parse(x.responseText);
        nameEl.textContent = s.channel || '';
        live = !!s.live;
      } catch (e) { live = false; }
      if (live) { attach(); } else { showWait(true); destroy(); }
    };
    x.onerror = function () { live = false; showWait(true); destroy(); };
    x.send();
  }
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
