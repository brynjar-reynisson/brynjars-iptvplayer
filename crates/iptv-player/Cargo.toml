[package]
name = "iptv-player"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "iptv_player"
path = "src/lib.rs"

[[bin]]
name = "iptv-player"
path = "src/main.rs"

[dependencies]
iptv = { path = "../iptv" }
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
libmpv2-sys = "4.0.1"
png = "0.18"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
