playlist_url = "http://example.invalid/get.php?username=USER&password=PASS&type=m3u_plus"

# Optional: User-Agent sent on the playlist download and on every stream
# request. Some providers reject requests without a known player User-Agent
# (e.g. "server returned HTTP 454"). Empty or missing = "VLC/3.0.20 LibVLC/3.0.20".
# user_agent = "VLC/3.0.20 LibVLC/3.0.20"

# Optional: live countries to list first, comma-separated, in this order
# (e.g. "Iceland, UK"). The other countries are alphabetical, with "Other" last.
# Applies after the next refresh (F5) or restart.
# top_countries = "Iceland, UK"

# Optional: use hardware video decoding for streams taller than 1080p (4K) only;
# everything else stays in software (default false = software for all).
# Hardware decoding showed black horizontal dashes / blocky corruption on some
# graphics cards. Needs a restart.
# hardware_decode = true
